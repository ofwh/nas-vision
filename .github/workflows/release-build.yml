name: Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate version tag
        id: tag
        run: |
          MAJOR=$(date +%Y)
          MINOR=$(date +%-m)
          PREFIX="${MAJOR}.${MINOR}"

          LATEST_TAG=$(git tag -l "${PREFIX}.*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            TIMES=0
          else
            TIMES=$(echo "$LATEST_TAG" | cut -d'.' -f3)
            TIMES=$((TIMES + 1))
          fi

          NEW_TAG="${PREFIX}.${TIMES}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-build.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ needs.prepare.outputs.new_tag }}
      publish-latest: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  finalize:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Update Docker Hub Description
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/nas-vision
          readme-filepath: ./README.md

      - name: Create version tag
        env:
          NEW_TAG: ${{ needs.prepare.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.new_tag }}
          name: Release ${{ needs.prepare.outputs.new_tag }}
          generate_release_notes: true
