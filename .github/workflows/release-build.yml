name: Release Build

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate version tag
        id: tag
        run: |
          MAJOR=$(date +%Y)
          MINOR=$(date +%-m)
          PREFIX="${MAJOR}.${MINOR}"

          LATEST_TAG=$(git tag -l "${PREFIX}.*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            TIMES=0
          else
            TIMES=$(echo "$LATEST_TAG" | cut -d'.' -f3)
            TIMES=$((TIMES + 1))
          fi

          NEW_TAG="${PREFIX}.${TIMES}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - type: app
            dockerfile: Dockerfile
            title: NAS Vision
            description: A self-hosted NAS dashboard
            tag-prefix: ''
            tags: |
              type=raw,value=latest
              type=raw,value=${{ needs.prepare.outputs.new_tag }}
          - type: migrate
            dockerfile: Dockerfile.migrate
            title: NAS Vision Migration
            description: Database migration container for NAS Vision
            tag-prefix: migrate-
            tags: |
              type=raw,value=migrate-latest
              type=raw,value=migrate-${{ needs.prepare.outputs.new_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nas-vision,enable=${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
            ghcr.io/${{ github.repository }}
          tags: ${{ matrix.image.tags }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.vendor=NAS Vision

      - name: Build and push ${{ matrix.image.type }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BASE_PATH=${{ vars.NEXT_PUBLIC_BASE_PATH }}
            NEXT_PUBLIC_AUTH_URL=${{ vars.NEXT_PUBLIC_AUTH_URL }}
          cache-from: |
            type=gha,scope=${{ github.workflow }}-${{ matrix.image.type }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.image.type }}

  finalize:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Update Docker Hub Description
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/nas-vision
          readme-filepath: ./README.md

      - name: Create version tag
        env:
          NEW_TAG: ${{ needs.prepare.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.new_tag }}
          name: Release ${{ needs.prepare.outputs.new_tag }}
          generate_release_notes: true
