name: nas-vision

services:
  app:
    image: ghcr.io/ofwh/nas-vision:latest
    restart: unless-stopped
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    # ports:
    #   - '3000:3000'
    volumes:
      - ${NAS_VISION_DATA:-./data}:/app/data
      - ${NAS_VISION_UPLOADS:-./uploads}:/app/public/static/uploads
    networks:
      nas-vision-network:
        ipv4_address: ${NAS_VISION_IP_ADDRESS}

networks:
  nas-vision-network:
    driver: bridge
    external: true
    name: ${NAS_VISION_BRIDGE_NETWORK}
